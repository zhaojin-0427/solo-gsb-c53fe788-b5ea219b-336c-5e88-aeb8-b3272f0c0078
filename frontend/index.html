<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>针织版型分码与行程编译台</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <h1>🧶 针织版型分码与行程编译台</h1>
  <div class="header-actions">
    <select id="projectSelect" title="已保存项目"></select>
    <button id="btnNew" class="btn">新建（载入默认样例）</button>
    <button id="btnSave" class="btn">保存项目</button>
    <button id="btnSolve" class="btn primary">▶ 联合求解并编译</button>
  </div>
</header>

<main>
  <!-- ============ 左：参数录入 ============ -->
  <section id="editor" class="panel">
    <h2>① 基准版型参数</h2>

    <div class="grid2">
      <label>项目名 <input id="pName" type="text"></label>
      <label>成品容差 (cm) <input id="pTol" type="number" step="0.1" min="0.05"></label>
    </div>

    <fieldset>
      <legend>针密（10cm）</legend>
      <div class="grid2">
        <label>横向针数 <input id="gSP" type="number" step="0.5" min="1"></label>
        <label>纵向行数 <input id="gRP" type="number" step="0.5" min="1"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>松量（参考记录，目标尺寸已含松量）</legend>
      <div class="grid2">
        <label>胸围松量 (cm) <input id="eBust" type="number" step="0.5"></label>
        <label>袖肥松量 (cm) <input id="eSleeve" type="number" step="0.5"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>罗纹与花样循环</legend>
      <div class="grid2">
        <label>下摆罗纹
          <select id="rHem"><option value="1x1">1×1（周期2）</option><option value="2x2">2×2（周期4）</option></select>
        </label>
        <label>袖口罗纹
          <select id="rCuff"><option value="1x1">1×1</option><option value="2x2">2×2</option></select>
        </label>
        <label>花样水平循环 P（针，1=无） <input id="patP" type="number" min="1" step="1"></label>
        <label>花样垂直循环 Q（行，1=无） <input id="patQ" type="number" min="1" step="1"></label>
      </div>
      <label class="check"><input id="patLock" type="checkbox"> 接缝两侧强制花样相位锁定（对应塑形事件绝对行号同余 mod Q，逐条校验）</label>
    </fieldset>

    <h2>② 各尺码目标尺寸（cm）</h2>
    <div id="sizeTables"></div>
    <button id="btnAddSize" class="btn small">＋ 添加尺码</button>

    <fieldset>
      <legend>缝合关系（说明）</legend>
      <ul class="seams">
        <li><b>侧缝</b>：前片/后片逐行匹配（共用行结构，必然相等）</li>
        <li><b>肩缝</b>：前后同阶梯数 × 同针数，阶梯行一一对应</li>
        <li><b>袖山↔袖窿</b>：装袖曲线缝合，按周长+吃势匹配（山高为窿深 0.7~1.05 倍）</li>
      </ul>
    </fieldset>
  </section>

  <!-- ============ 右：结果 ============ -->
  <section id="results" class="panel">
    <div id="solveStatus" class="status hidden"></div>

    <div id="resultArea" class="hidden">
      <div class="tabs">
        <button class="tab active" data-tab="overview">求解概览</button>
        <button class="tab" data-tab="outline">多码轮廓叠图</button>
        <button class="tab" data-tab="instructions">逐行编织指令</button>
        <button class="tab" data-tab="sim">逐行模拟校验</button>
        <button class="tab" data-tab="measures">尺寸偏差</button>
        <button class="tab" data-tab="revision">🧵 试织纠偏</button>
      </div>

      <div id="tab-overview" class="tabpane"></div>
      <div id="tab-outline" class="tabpane hidden">
        <div class="outline-controls">
          <label>衣片：
            <select id="ocPiece">
              <option value="front">前片</option>
              <option value="back">后片</option>
              <option value="sleeve">袖片</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="ocGrid" checked> 显示 1cm 网格</label>
        </div>
        <svg id="outlineSvg" viewBox="0 0 600 700"></svg>
      </div>
      <div id="tab-instructions" class="tabpane hidden">
        <div class="instr-controls">
          <label>尺码 <select id="inSize"></select></label>
          <label>衣片 <select id="inPiece">
            <option value="front">前片</option>
            <option value="back">后片</option>
            <option value="sleeve">袖片</option>
          </select></label>
          <label>区段筛选
            <select id="inSection">
              <option value="all">全部</option>
              <option value="rib">罗纹</option>
              <option value="side">侧区加针</option>
              <option value="arm">挂肩/肩/领</option>
              <option value="inc">袖下加针</option>
              <option value="cap">袖山</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="inEventsOnly"> 仅显示有塑形事件的行</label>
        </div>
        <div id="instrSummary" class="instr-summary"></div>
        <div class="table-wrap"><table id="instrTable"></table></div>
      </div>
      <div id="tab-sim" class="tabpane hidden"></div>
      <div id="tab-measures" class="tabpane hidden"></div>
      <div id="tab-revision" class="tabpane hidden">
        <div id="revIntro" class="rev-intro"></div>
        <div class="rev-controls">
          <label>绑定求解结果
            <select id="rvResult"></select>
          </label>
          <label>尺码 <select id="rvSize"></select></label>
          <label>衣片 <select id="rvPiece">
            <option value="front">前片</option>
            <option value="back">后片</option>
            <option value="sleeve">袖片</option>
          </select></label>
          <label>已织行数（前缀，不可改写）
            <input id="rvPrefix" type="number" min="1" step="1">
          </label>
        </div>
        <div class="rev-actions">
          <button id="rvBuild" class="btn small">载入前缀登记表</button>
          <button id="rvRecalc" class="btn small">按操作+意外针重算活针</button>
          <button id="rvSubmit" class="btn small primary">▶ 锁定前缀并重排余下行程</button>
          <span id="rvHint" class="rev-hint"></span>
        </div>
        <div id="rvStatus" class="status hidden"></div>
        <div id="rvRegisterWrap" class="table-wrap hidden">
          <table id="rvRegister"></table>
        </div>
        <div id="rvOutcome"></div>
        <h3 class="rev-saved-title">该求解结果的已保存修订</h3>
        <div id="rvSaved" class="rev-saved"></div>
      </div>
    </div>

    <div id="emptyHint" class="empty-hint">
      <p>设置参数后点击右上角「▶ 联合求解并编译」。</p>
      <p class="muted">求解器将按 <b>最大尺寸误差 → 塑形事件数 → 相邻尺码跳变</b> 的次序择优，
      并在无解时标出冲突字段。</p>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
